services:
  - type: web
    name: postiz-backend
    env: node
    plan: free
    buildCommand: npm install -g pnpm@10.6.1 && pnpm install --frozen-lockfile && pnpm run build:backend
    startCommand: pnpm dlx prisma@6.5.0 db push --schema ./libraries/nestjs-libraries/src/database/prisma/schema.prisma --accept-data-loss && node --experimental-require-module apps/backend/dist/apps/backend/src/main.js
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: REDIS_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: IS_GENERAL
        value: "true"
      - key: STORAGE_PROVIDER
        value: local
      - key: NODE_ENV
        value: production
      - key: FRONTEND_URL
        value: https://postiz-app-tech-19bc0926.vercel.app
      - key: MAIN_URL
        value: https://postiz-app-tech-19bc0926.vercel.app
      - key: BACKEND_INTERNAL_URL
        value: http://localhost:3000
      - key: DISABLE_REGISTRATION
        value: "false"
